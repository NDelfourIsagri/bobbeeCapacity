<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond sombre arrondi -->
  <rect width="32" height="32" rx="7" fill="#110f1f"/>

  <!-- Ligne de référence verticale (today) -->
  <rect x="9" y="4" width="1.5" height="24" rx="0.75" fill="#ffffff" opacity="0.15"/>

  <!-- Barre sprint 1 — violet, courte (effort < sprint) -->
  <rect x="9" y="5" width="10" height="5" rx="2.5" fill="#7c3aed"/>

  <!-- Barre sprint 2 — cyan, moyenne -->
  <rect x="9" y="13" width="15" height="5" rx="2.5" fill="#0891b2"/>

  <!-- Barre sprint 3 — vert, longue (effort > 1 sprint) -->
  <rect x="9" y="21" width="13" height="5" rx="2.5" fill="#059669"/>

  <!-- Contour fantôme sprint 1 -->
  <rect x="9" y="5" width="19" height="5" rx="2.5" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.35"/>
</svg>
